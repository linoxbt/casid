name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bun:
    name: core + coordinator (bun test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run --filter @casid/core build
      - run: bun run --filter @casid/core test
      - run: bun run --filter @casid/coordinator test

  contracts:
    name: forge test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test -vvv
        working-directory: contracts

  web:
    name: web (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run --filter @casid/core build
      - run: bun run --filter @casid/web lint
      - run: bun run --filter @casid/web build
