[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.25"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./" }]

[profile.default.fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
coston2 = "${FLARE_RPC_URL}"
flare = "https://flare-api.flare.network/ext/C/rpc"

[etherscan]
coston2 = { key = "${FLARESCAN_API_KEY}", url = "https://coston2-explorer.flare.network/api" }
