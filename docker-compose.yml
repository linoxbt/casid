# Optional local stack for Casid services.
services:
  coordinator:
    image: oven/bun:1.2
    working_dir: /app
    volumes:
      - .:/app
    command: bun run --filter @casid/coordinator start
    environment:
      COORDINATOR_PORT: 4100
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:?set WEBHOOK_SIGNING_SECRET}
      CASID_API_KEY: ${CASID_API_KEY:?set CASID_API_KEY}
      FLARE_RPC_URL: https://coston2-api.flare.network/ext/C/rpc
      FLARE_CHAIN_ID: "114"
    ports:
      - "4100:4100"

  web:
    image: oven/bun:1.2
    working_dir: /app
    volumes:
      - .:/app
    command: bun run --filter @casid/web dev
    environment:
      NEXT_PUBLIC_COORDINATOR_URL: http://localhost:4100
      NEXT_PUBLIC_CASID_API_KEY: ${CASID_API_KEY:?set CASID_API_KEY}
    ports:
      - "3100:3100"
    depends_on:
      - coordinator
